<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#363D40"/>
      <stop offset="1" stop-color="#23282A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#9E875D" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9E875D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6B083"/>
      <stop offset="1" stop-color="#8A734A"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background (iOS applies its own mask) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- baseline -->
  <rect x="232" y="742" width="560" height="20" rx="10" fill="#9E875D" opacity="0.55"/>

  <!-- rising "buildings" (commercial management = construction + growth) -->
  <g>
    <rect x="300" y="556" width="120" height="186" rx="16" fill="url(#bronze)"/>
    <rect x="452" y="452" width="120" height="290" rx="16" fill="url(#bronze)"/>
    <rect x="604" y="320" width="120" height="422" rx="16" fill="url(#bronze)"/>

    <!-- windows on the tallest tower -->
    <g fill="#2D3436" opacity="0.55">
      <rect x="628" y="360" width="30" height="30" rx="5"/>
      <rect x="670" y="360" width="30" height="30" rx="5"/>
      <rect x="628" y="412" width="30" height="30" rx="5"/>
      <rect x="670" y="412" width="30" height="30" rx="5"/>
      <rect x="628" y="464" width="30" height="30" rx="5"/>
      <rect x="670" y="464" width="30" height="30" rx="5"/>
    </g>
  </g>

  <!-- upward profit/growth arrow across the tops -->
  <g fill="none" stroke="#F5F3EE" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M312 540 L512 436 L664 300"/>
    <path d="M566 286 L690 282 L688 408"/>
  </g>
</svg>
